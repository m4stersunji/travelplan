name: Flight Price Tracker

on:
  schedule:
    # Every 2 hours — LINE notifies every 6h or on price alert
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force LINE notification regardless of hour'
        type: boolean
        default: false

jobs:
  track-flights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID=${{ secrets.LINE_USER_ID }}
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_PATH=./credentials.json
          ENVEOF

      - name: Create Google credentials file
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run flight tracker
        env:
          NOTIFY_EVERY_HOURS: ${{ inputs.force_notify && '1' || '6' }}
        run: |
          mkdir -p data logs
          python src/main.py

      - name: Commit DB back to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/flights.db
          if git diff --cached --quiet; then
            echo "No DB changes to commit"
          else
            git commit -m "data: scrape run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "Push retry $i"
              sleep 5
            done
          fi

      - name: Show results
        if: always()
        run: |
          echo "=== Log output ==="
          cat logs/*.log 2>/dev/null || echo "No logs"
          echo ""
          echo "=== CSV files ==="
          ls -la data/*.csv 2>/dev/null || echo "No CSVs"
